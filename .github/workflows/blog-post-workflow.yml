name: Latest blog post workflow
on:
  schedule: # Run workflow automatically
    - cron: '0 0 * * *'  # Runs at 00:00 UTC every day
  workflow_dispatch: # Run workflow manually through the GitHub Actions tab directly
permissions:
  contents: write # To write the generated contents to the readme

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull in guinuxbr.com posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1.9.7
        with:
          feed_list: "https://guinuxbr.com/index.xml"
